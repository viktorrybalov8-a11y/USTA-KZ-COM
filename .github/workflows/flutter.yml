name: Flutter checks and Android APK
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install
      - name: Compile Cloud Functions
        working-directory: functions
        run: npm run build
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org=kz.nargizgryp --project-name=usta_kz .
      - name: Configure Android for Firebase plugins
        run: python3 tool/configure_android.py
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: USTA-KZ-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
  admin-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Generate standalone admin Android app
        working-directory: admin-app
        run: flutter create --platforms=android --org=kz.nargizgryp --project-name=usta_admin .
      - name: Configure admin Android build
        run: python3 tool/configure_admin_android.py
      - name: Remove generated admin sample test
        working-directory: admin-app
        run: rm -f test/widget_test.dart
      - name: Analyze and test admin app
        working-directory: admin-app
        run: |
          flutter pub get
          flutter analyze lib test
          flutter test
      - name: Build administrator APK
        working-directory: admin-app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: USTA-Admin-debug-apk
          path: admin-app/build/app/outputs/flutter-apk/app-debug.apk
